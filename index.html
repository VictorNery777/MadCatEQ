<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MadCatEQ</title>
<style>
:root{color-scheme:light dark;--bg:#ececec;--fg:#151515;--mut:#6a6a6a;--bd:#b8b8b8;--ac:#2b2b2b;--acf:#fff;--gr:#00000018;--cv:#f6f6f699;--cat:.11;--blend:multiply;--inv:0}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#ececec;--mut:#9a9a9a;--bd:#3c3c3c;--ac:#d6d6d6;--acf:#111;--gr:#ffffff1a;--cv:#1a1a1ae6;--cat:.1;--blend:screen;--inv:1}}
body::before{content:"";position:fixed;inset:10%;z-index:-1;pointer-events:none;background:var(--bg-url) center/contain no-repeat;opacity:var(--cat);mix-blend-mode:var(--blend);filter:invert(var(--inv))}
body{font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}.m{color:var(--mut);font-size:13px}
[hidden]{display:none!important}
.r{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button,select,input,textarea{font:inherit;color:inherit;background:transparent;border:1px solid var(--bd);border-radius:6px;padding:6px 9px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:var(--acf)}button:disabled{opacity:.4;cursor:default}
table{border-collapse:collapse;width:100%}td,th{padding:3px;text-align:left;font-size:13px}td input,td select{width:100%;box-sizing:border-box}
#pi{display:flex;flex:1 1 100%;gap:6px}#pi button{flex:1 1 0;height:38px;min-width:0;border-radius:19px;padding:0 6px;font-weight:600;white-space:nowrap}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}.bar button{flex:1 1 0;height:38px;min-width:0;border-radius:19px;padding:0 6px;font-weight:600}
#rs,#ra{flex:none;width:28px;height:28px;padding:0;border-radius:50%;line-height:1;font-size:16px}#ra{background:#2b2b2b;border-color:#2b2b2b;color:#fff}
@media(prefers-color-scheme:dark){#ra{background:#3a3a3a;border-color:#5a5a5a}}
#pi button.on{background:var(--ac);border-color:var(--ac);color:var(--acf)}
:root[data-theme=light]{color-scheme:light;--bg:#ececec;--fg:#151515;--mut:#6a6a6a;--bd:#b8b8b8;--ac:#2b2b2b;--acf:#fff;--gr:#00000018;--cv:#f6f6f699;--cat:.11;--blend:multiply;--inv:0}
:root[data-theme=dark]{color-scheme:dark;--bg:#121212;--fg:#ececec;--mut:#9a9a9a;--bd:#3c3c3c;--ac:#d6d6d6;--acf:#111;--gr:#ffffff1a;--cv:#1a1a1ae6;--cat:.1;--blend:screen;--inv:1}
:root[data-theme=light] #ra{background:#2b2b2b;border-color:#2b2b2b}:root[data-theme=dark] #ra{background:#3a3a3a;border-color:#5a5a5a}
#th{display:flex;gap:6px}#th button{flex:none;width:28px;height:28px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}#th button.on{background:var(--ac);border-color:var(--ac);color:var(--acf)}
tr.sel td{background:var(--gr)}
#cv{display:block;flex:1 1 0;min-width:0;height:260px;background:var(--cv);border:1px solid var(--bd);border-radius:6px;touch-action:none;margin:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}#toast.on{opacity:1}#toast.w{background:var(--ac);color:var(--acf);outline:2px solid var(--bg)}
textarea{width:100%;box-sizing:border-box;height:80px;font:12px monospace}
.gw{display:flex;gap:8px;align-items:stretch;margin:10px 0 4px}
.pa{flex:none;width:56px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;line-height:1.2}
.pa input[type=range]{flex:1 1 0;min-height:0;width:24px;padding:0;border:0;writing-mode:vertical-lr;direction:rtl;accent-color:var(--ac);cursor:pointer}
.pa input[type=number]{width:100%;box-sizing:border-box;padding:4px 2px;text-align:center;font-size:13px}
#con{display:inline-flex;align-items:center;gap:8px;height:38px;border-radius:19px;padding:0 18px;font-weight:600}
#tip{position:fixed;left:0;top:0;z-index:30;max-width:270px;background:var(--fg);color:var(--bg);padding:8px 11px;border-radius:8px;font-size:12.5px;line-height:1.45;white-space:pre-line;pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 4px 14px #0004}
#tip.on{opacity:1}
</style></head><body>
<div class="top" style="align-items:center"><h1>MadCatEQ</h1><div id="th"><button id="thl" data-k="light" data-tip="Modo claro." aria-label="Modo claro"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button><button id="thd" data-k="dark" data-tip="Modo escuro." aria-label="Modo escuro"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div></div>

<div class="r">
 <button class="p" id="con" data-tip="Parear a DAC via USB."><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 18V4"/><path d="M12 2.5l-2.5 3.5h5z" fill="currentColor"/><path d="M12 15l-5-3V9.5"/><circle cx="7" cy="8" r="1.5"/><path d="M12 12l5-3V7.5"/><rect x="15.5" y="4.5" width="3" height="3"/><circle cx="12" cy="20" r="2"/></svg><span id="cl">Conectar</span></button>
 <select id="prof" hidden></select>
</div>

<div class="r">
 <span id="pi" class="pi" data-tip="Os presets A–D soam ao selecionar.&#10;Só o Custom EQ é editável."></span><select id="pre" hidden></select>
</div>

<div class="gw">
 <canvas id="cv" data-tip-at="pointer" data-tip="Arraste um ponto: horizontal = frequência, vertical = ganho.&#10;Roda do mouse sobre o ponto = Q.&#10;Duplo clique = zera o ganho.&#10;As alterações soam em tempo real.&#10;Edição só no Custom EQ."></canvas>
 <div class="pa" data-tip="Gain da DAC (FiiO JA11 / Preamp).&#10;Ajusta o ganho de saída da DAC em tempo real.&#10;Duplo clique no controle = 0 dB.">
  <span class="m">Gain<br>dB</span>
  <input type="range" id="prs" min="-12" max="12" step="0.5" value="0" aria-label="Gain (dB)">
  <input type="number" id="prn" min="-12" max="12" step="0.5" value="0.0" aria-label="Gain (dB)">
 </div>
</div>
<div class="r" id="tl" style="justify-content:flex-end;margin:6px 0"><button id="ra" data-tip="Volta ao estado lido da DAC ao conectar (bandas e ganho)." aria-label="Voltar ao estado lido da DAC">⚓︎</button><button id="rs" data-tip="Zera todas as bandas e o ganho (Flat e 0 dB)." aria-label="Resetar tudo">↺</button></div>

<table><thead data-tip-at="pointer" data-tip="Também dá para digitar direto na tabela (só no Custom EQ)."><tr><th>#</th><th>Freq (Hz)</th><th>Ganho (dB)</th><th>Q</th></tr></thead><tbody id="tb"></tbody></table>

<div class="r bar"><button class="p" id="sv" data-tip="Grava na DAC o perfil selecionado.&#10;A DAC reinicia.">Salvar</button><button id="im" data-tip="Importar .txt (Equalizer APO / AutoEQ) para o Custom EQ.">Importar</button><button id="ex" data-tip="Exportar o preset atual (.txt).">Exportar</button><input type="file" id="imf" accept=".txt,text/plain" hidden></div>
<div id="toast"></div>
<div id="tip"></div>

const isCustom=()=>$('pre').value===CUS;
const active=b=>b.gain!==0;

// ---- CRC-8 Maxim para protocolo FiiO (Report 0x02) ----
function crc8_maxim(arr){
 let crc=0;
 for(let i=0;i<arr.length;i++){
  crc^=arr[i];
  for(let j=0;j<8;j++){
   if(crc&1)crc=(crc>>>1)^0x8C;
   else crc>>>=1;
  }
 }
 return crc;
}
let fiioSeq=0;
// Monta e envia um frame FiiO nativo: AA 0A 00 seq cmd len ...payload crc EE (Report 0x02)
function fiioFrame(cmd,payload,hdr=0xAA,sub=0x0A){
 const body=[hdr,sub,0x00,(fiioSeq++)&0xFF,cmd,payload.length,...payload];
 return new Uint8Array([...body,crc8_maxim(body),0xEE]);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const i16=v=>{v=Math.round(v);return v<0?v+65536:v};
// cmd 0x17 sub 0x02 = ganho (dB x10, int16 big-endian)
function fiioGainFrame(db){const u=i16(db*10);return fiioFrame(0x17,[(u>>8)&0xFF,u&0xFF])}
// cmd 0x15 len 8 = banda: idx, ganho(int16 x10), fc(u16 Hz), Q(u16 x100), tipo
function fiioBandFrame(i,b){
 const g=i16(cl(b.gain,-12,12)*10),f=Math.round(cl(b.fc,20,20000)),q=Math.round(cl(b.q,0.1,5)*100);
 return fiioFrame(0x15,[i,(g>>8)&0xFF,g&0xFF,(f>>8)&0xFF,f&0xFF,(q>>8)&0xFF,q&0xFF,0x00]); // tipo fixo: 0x00 = Peak (PK)
}
// cmd 0x19 len 1 = gravar na flash (slot 3, conforme capturado)
const fiioSaveFrame=(slot=0x03)=>fiioFrame(0x19,[slot]);
const isFiioDev=()=>dev&&(dev.vendorId===0x2972||dev.productId===0x0102);
const isKtF20=()=>!!(dev&&dev.vendorId===VID&&dev.productId===0x0111);

// ---- HID ----
const has4B=d=>d.collections.some(c=>c.outputReports.some(r=>r.reportId===RID));
const has02=d=>d.collections.some(c=>c.outputReports.some(r=>r.reportId===0x02));
let initPre=null,pend02=null;
// guarda o ganho lido da DAC na conexão (1ª leitura) e o associa à âncora
function noteInitPre(g){if(initPre!==null)return;initPre=g;if(anchor&&anchor.pre==null)anchor.pre=g}
// Leitura nativa FiiO (igual ao site oficial): BB 0B 00 00 cmd len [payload] 00 EE
function readFrame(cmd,payload=[]){return new Uint8Array([0xBB,0x0B,0x00,0x00,cmd,payload.length,...payload,0x00,0xEE])}
async function req02(cmd,payload=[],match=null,ms=900,tries=3){
 let err;
 for(let t=0;t<tries;t++){
  try{
   return await new Promise((ok,no)=>{
    pend02={cmd,match,ok,t:setTimeout(()=>{pend02=null;no(new Error('timeout'))},ms)};
    dev.sendReport(0x02,readFrame(cmd,payload)).catch(e=>{clearTimeout(pend02&&pend02.t);pend02=null;no(e)});
   });
  }catch(e){err=e}
 }
 throw err;
}
function onRep(e){
 const d=new Uint8Array(e.data.buffer,e.data.byteOffset,e.data.byteLength);
 if(e.reportId===0x02){
  console.log('%c[FiiO HID IN]','color:#ffaa00;font-weight:bold','ReportID: 0x02 Bytes:',Array.from(d).map(b=>'0x'+b.toString(16).padStart(2,'0').toUpperCase()).join(' '));
  // tolera o byte de Report ID vir (ou não) no início do buffer
  let o=-1;for(let k=0;k<=1&&o<0;k++)if(d[k]===0xBB||d[k]===0xAA)o=k;
  if(o<0)return;
  const c=d[o+4],len=d[o+5],pl=Array.from(d.slice(o+6,o+6+len));
  if(c===0x17&&len>=2){ // ganho global: dB x10, int16 big-endian
   let val=(pl[len-2]<<8)|pl[len-1];if(val>32767)val-=65536;
   const g=cl(val/10,-12,12);
   noteInitPre(g);
   setPre(g,0,true);
  }
  if(d[o]===0xBB&&pend02&&pend02.cmd===c&&(!pend02.match||pend02.match(pl))){
   clearTimeout(pend02.t);const q=pend02;pend02=null;q.ok(pl);
  }
  return;
 }
 if(e.reportId!==RID||!pend)return;
 const a=(d[0]|d[1]<<8|d[2]<<16|d[3]<<24)>>>0;
 if(d[4]===pend.cmd&&a===pend.addr){const v=(d[6]|d[7]<<8|d[8]<<16|d[9]<<24)>>>0;clearTimeout(pend.t);const p=pend;pend=null;p.ok(v)}
}
function xfer(addr,cmd,val,ms=1500){
 const p=chain.then(()=>new Promise((ok,no)=>{
  if(!dev)return no(new Error('sem dispositivo'));
  pend={addr,cmd,ok,t:setTimeout(()=>{pend=null;no(new Error('timeout'))},ms)};
  const b=new Uint8Array([addr&255,addr>>8&255,addr>>16&255,addr>>>24,cmd,0,val&255,val>>8&255,val>>16&255,val>>>24]);
  dev.sendReport(RID,b).catch(e=>{clearTimeout(pend&&pend.t);pend=null;no(e)});
 }));
 chain=p.catch(()=>{});return p;
}
const rd=a=>xfer(a,0x52,0);
async function wr(a,v){
 if(BLOCK.includes(a)){console.warn('Escrita no reg 0x'+a.toString(16)+' bloqueada com segurança.');return}
 const s=await xfer(a,0x57,v>>>0)&255;
 if(!OK.includes(s))log('Reg 0x'+a.toString(16)+': status inesperado 0x'+s.toString(16),1);
}
async function enableEQ(p){
 const e=(await rd(p.en))>>>0,n=(e|1)>>>0;
 if(isKtF20()&&n===e)return;
 await wr(p.en,n);
}
async function openDev(d){
 if(!d.opened)await d.open();
 if(dev)dev.removeEventListener('inputreport',onRep);
 dev=d;d.addEventListener('inputreport',onRep);sent=null;enOn=false;initPre=null;
 const k=PID[d.productId];if(k)$('prof').value=k;
 setConn(true);
 updatePreUI();
 if(!k)log('Modelo de DAC não reconhecido: usando o perfil padrão.',1);
 // sequencial: primeiro as bandas (0x4B), depois o ganho (0x02), sem tráfego concorrente na DAC
 (async()=>{await readDev(1);await readPre()})();
}
async function connect(){
 const ds=await navigator.hid.requestDevice({filters:[{vendorId:VID},{vendorId:0x2972}]});
 const d=ds.find(has4B)||ds[0];if(!d)return;
 if(!has4B(d))log('Aviso: interface sem report 0x4B; escolha a outra entrada da lista.',1);
 await openDev(d);
}
// ---- codec ----
function enc(b,half){
 const f=Math.round(cl(b.fc,20,20000)/(half?2:1)),g=Math.round(cl(b.gain,-10,10)*10),q=Math.round(cl(b.q,0.1,5)*1000);
 return[((f<<16)|(g&0xFFFF))>>>0,(((TY[b.type]||0)<<16)|q)>>>0];
}
function dec(a,w,half){
 let g=a&0xFFFF;if(g>32767)g-=65536;
 return{type:'PK',fc:(a>>>16)*(half?2:1),gain:g/10,q:(w&0xFFFF)/1000};
}
// ---- plano ----
function plan(){
 const p=P();let n=0;
 return cur.map(b=>active(b)?(n++<p.n_?1:-2):0);
}
// ---- ações ----
function build(){
 const p=P(),half=!!p.half,pl=plan(),bs=cur.filter((b,i)=>pl[i]===1),want=[],regs=[];
 for(let i=0;i<p.n_;i++){const[A,B]=enc(bs[i]||neutral(i,p.n_),half);want.push(A,B);regs.push(p.base+2*i,p.base+2*i+1)}
 return{want,regs,ov:pl.filter(x=>x===-2).length};
}
function live(){
 if(!dev||liveT)return;
 liveT=setTimeout(()=>{liveT=0;pushLive()},60);
}
async function pushLive(){
 if(!dev)return;
 if(busy){again=true;return}
 busy=true;
 try{
  do{
   again=false;
   const p=P(),{want,regs}=build();
   if(!sent||sent.length!==want.length)sent=new Array(want.length).fill(null);
   for(let i=0;i<want.length;i++){
    if(sent[i]!==want[i]){await wr(regs[i],want[i]);sent[i]=want[i]}
   }
   if(!enOn){await enableEQ(p);enOn=true}
  }while(again);
 }catch(x){sent=null;log('Erro: '+x.message,1)}
 finally{busy=false}
}
// Salvar pelo protocolo nativo FiiO (Report 0x02), usado em todos os chips KT que expõem o report 0x02: bandas (0x15) -> pregain (0x17) -> gravar (0x19)
async function applyFiio(){
 const p=P(),pl=plan(),bs=cur.filter((b,i)=>pl[i]===1),ov=pl.filter(x=>x===-2).length;
 const send=async f=>{await dev.sendReport(0x02,f);await sleep(40)};
 for(let i=0;i<p.n_;i++)await send(fiioBandFrame(i,bs[i]||neutral(i,p.n_)));
 await send(fiioGainFrame(preamp));   // garante que o pregain atual vá junto com o perfil
 await send(fiioSaveFrame());
 sent=null;
 if(isCustom())try{localStorage.setItem('ktEqCustom',JSON.stringify(custom))}catch(x){}
 toast('Gravado na DAC (pregain '+(preamp>0?'+':'')+preamp.toFixed(1)+' dB).'+(ov?' ('+ov+' banda(s) acima do limite de '+p.n_+' ignorada(s))':''));
}
async function apply(){
 if(dev&&has02(dev)){try{await applyFiio()}catch(x){log('Erro ao salvar: '+x.message,1)}return}
 try{
  const p=P(),{want,regs,ov}=build();
  for(let i=0;i<want.length;i++)await wr(regs[i],want[i]);
  let bad=0;
  for(let i=0;i<want.length;i++){if((await rd(regs[i]))!==want[i])bad++}
  if(isCustom())try{localStorage.setItem('ktEqCustom',JSON.stringify(custom))}catch(x){}
  if(bad)return log('Verificação falhou: '+bad+' registrador(es) divergente(s).',1);
  sent=want.slice();
  await enableEQ(p);enOn=true;
  const extra=ov?' ('+ov+' banda(s) acima do limite de '+p.n_+' ignorada(s))':'';
  if(p.save){
   try{await xfer(0,0x53,0,3000)}catch(x){}
   toast('Gravado na DAC (flash).'+extra);
  }else toast('Este chip não grava na flash; EQ aplicado só até desligar.'+extra,1);
 }catch(x){log('Erro: '+x.message,1)}
}
async function rdRetry(a,n=3){
 let err;
 for(let t=0;t<n;t++){try{return await xfer(a,0x52,0,900)}catch(x){err=x}}
 throw err;
}
async function readDevFiio(isNew){
 try{
  const p=P();let n=p.n_;
  try{const c=await req02(0x18);if(c.length&&c[0]>=1&&c[0]<=12)n=c[0]}catch(x){}
  const out=[];let shelf=0;
  for(let i=0;i<n;i++){
   const r=await req02(0x15,[i],pl=>pl[0]===i);
   let g=(r[1]<<8)|r[2];if(g>32767)g-=65536;
   if(r[7])shelf++;
   out.push({type:'PK',fc:(r[3]<<8)|r[4],gain:g/10,q:((r[5]<<8)|r[6])/100});
  }
  console.log('%c[MadCat] leitura nativa da DAC','color:#00aaff;font-weight:bold',JSON.stringify(out));
  custom=out;
  if(isNew)anchor={k:$('prof').value,bands:out.map(b=>({...b})),pre:initPre};
  $('pre').value=CUS;sel();
  try{localStorage.setItem('ktEqCustom',JSON.stringify(custom))}catch(x){}
  if(isNew)toast('Lido da DAC: '+out.length+' bandas.'+(shelf?' '+shelf+' shelf tratado(s) como Peak.':''),!!shelf);
 }catch(x){log('Não foi possível ler o EQ da DAC ('+x.message+').',1)}
}
async function readDev(isNew){
 if(dev&&has02(dev))return readDevFiio(isNew);
 try{
  const p=P(),half=!!p.half,out=[];
  for(let i=0;i<p.n_;i++)out.push(dec(await rdRetry(p.base+2*i),await rdRetry(p.base+2*i+1),half));
  console.log('%c[MadCat] leitura da DAC','color:#00aaff;font-weight:bold',JSON.stringify(out));
  custom=out;
  if(isNew)anchor={k:$('prof').value,bands:out.map(b=>({...b})),pre:initPre};
  $('pre').value=CUS;sel();
  try{localStorage.setItem('ktEqCustom',JSON.stringify(custom))}catch(x){}
  if(isNew)toast('Lido da DAC: '+out.length+' bandas.');
 }catch(x){log('Não foi possível ler o EQ da DAC ('+x.message+'). Mostrando o último EQ salvo no navegador.',1)}
}
// ---- resposta em frequência ----
function coefs(b,fs=48000){
 const f=cl(b.fc,20,20000),w0=2*Math.PI*Math.min(f,fs/2*.99)/fs,c=Math.cos(w0),s=Math.sin(w0),q=cl(b.q,0.1,5),al=s/(2*q),A=Math.pow(10,b.gain/40);
 return[1+al*A,-2*c,1-al*A,1+al/A,-2*c,1-al/A];
}
function magDb(k,f,fs=48000){
 const w=2*Math.PI*f/fs,c1=Math.cos(w),s1=Math.sin(w),c2=Math.cos(2*w),s2=Math.sin(2*w);
 const nr=k[0]+k[1]*c1+k[2]*c2,ni=k[1]*s1+k[2]*s2,dr=k[3]+k[4]*c1+k[5]*c2,di=k[4]*s1+k[5]*s2;
 return 10*Math.log10((nr*nr+ni*ni)/(dr*dr+di*di));
}
// ---- gráfico ----
const FMIN=20,FMAX=20000,DB=12,PL=34,PR=10,PT=10,PB=20;
function cv(){return $('cv')}
const gx=(f,W)=>PL+Math.log(f/FMIN)/Math.log(FMAX/FMIN)*(W-PL-PR);
const gy=(g,H)=>PT+(1-(g+DB)/(2*DB))*(H-PT-PB);
const ix=(x,W)=>FMIN*Math.pow(FMAX/FMIN,(x-PL)/(W-PL-PR));
const iy=(y,H)=>(1-(y-PT)/(H-PT-PB))*2*DB-DB;
function draw(){
 const c=cv(),dpr=window.devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
 if(!W)return;
 if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)}
 const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
 const cs=getComputedStyle(document.body),fg=cs.getPropertyValue('--fg')||'#000',mut=cs.getPropertyValue('--mut')||'#888',ac=cs.getPropertyValue('--ac')||'#2b2b2b',bd=cs.getPropertyValue('--bd')||'#ccc',acf=cs.getPropertyValue('--acf')||'#fff';
 x.font='11px system-ui,sans-serif';x.lineWidth=1;
 // grade
 x.textAlign='right';x.textBaseline='middle';
 for(let g=-DB;g<=DB;g+=6){const y=Math.round(gy(g,H))+.5;x.strokeStyle=g===0?mut:bd;x.globalAlpha=g===0?.8:.45;x.beginPath();x.moveTo(PL,y);x.lineTo(W-PR,y);x.stroke();x.globalAlpha=1;x.fillStyle=mut;x.fillText((g>0?'+':'')+g,PL-5,y)}
 x.textAlign='center';x.textBaseline='top';
 for(const f of[20,50,100,200,500,1000,2000,5000,10000,20000]){const px=Math.round(gx(f,W))+.5;x.strokeStyle=bd;x.globalAlpha=.45;x.beginPath();x.moveTo(px,PT);x.lineTo(px,H-PB);x.stroke();x.globalAlpha=1;x.fillStyle=mut;x.fillText(f>=1000?(f/1000)+'k':f,px,H-PB+4)}
 // curva
 const pl=plan(),ks=cur.filter((b,i)=>pl[i]===1).map(b=>coefs(b));
 const N=Math.max(120,Math.round(W/2));x.beginPath();
 for(let i=0;i<=N;i++){
  const f=FMIN*Math.pow(FMAX/FMIN,i/N);let d=0;for(const k of ks)d+=magDb(k,f);
  const px=gx(f,W),py=gy(cl(d,-DB,DB),H);i?x.lineTo(px,py):x.moveTo(px,py);
 }
 x.strokeStyle=ac;x.lineWidth=2;x.stroke();x.lineWidth=1;
 // pontos
 nodes=[];
 cur.forEach((b,i)=>{
  const px=gx(cl(b.fc,FMIN,FMAX),W),py=gy(cl(b.gain,-DB,DB),H);
  nodes.push({i,x:px,y:py});
 });
 nodes.forEach(n=>{
  const st=pl[n.i],on=st===1,s=n.i===si;
  x.beginPath();x.arc(n.x,n.y,s?9:7,0,7);
  x.fillStyle=on?ac:'transparent';x.globalAlpha=on?1:.9;x.fill();x.globalAlpha=1;
  x.setLineDash(st<0?[3,2]:[]);x.strokeStyle=on?ac:mut;x.lineWidth=s?2:1.5;x.stroke();x.setLineDash([]);x.lineWidth=1;
  x.fillStyle=on?acf:mut;x.textAlign='center';x.textBaseline='middle';x.fillText(n.i+1,n.x,n.y+.5);
 });
 const b=cur[si];
 if(b){
  const t=(si+1)+': '+Math.round(b.fc)+' Hz  '+(b.gain>0?'+':'')+b.gain.toFixed(1)+' dB  Q '+b.q.toFixed(2);
  x.textAlign='left';x.textBaseline='top';x.fillStyle=fg;x.fillText(t,PL+6,PT+3);
 }
}
function pick(px,py,r=16){
 let best=null,bd=r*r;
 for(const n of nodes){const d=(n.x-px)**2+(n.y-py)**2;if(d<=bd){bd=d;best=n}}
 return best;
}
function pos(e){const r=cv().getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function syncRow(i){
 const r=$('tb').rows[i];if(!r)return;const b=cur[i],c=r.querySelectorAll('input');
 c[0].value=b.fc;c[1].value=b.gain;c[2].value=b.q;
}
function markSel(){[...$('tb').rows].forEach((r,i)=>r.classList.toggle('sel',i===si))}
function setupCanvas(){
 const c=cv();
 c.addEventListener('pointerdown',e=>{
  const[px,py]=pos(e),n=pick(px,py);
  if(!n)return;si=n.i;markSel();
  if(!isCustom()){draw();toast('Preset fixo: edição só no Custom EQ.');return}
  drag=n.i;c.setPointerCapture(e.pointerId);draw();
 });
 c.addEventListener('pointermove',e=>{
  const[px,py]=pos(e),W=c.clientWidth,H=c.clientHeight;
  if(drag===null){c.style.cursor=pick(px,py)?(isCustom()?'grab':'default'):'default';return}
  c.style.cursor='grabbing';
  const b=cur[drag];
  b.fc=Math.round(cl(ix(cl(px,PL,W-PR),W),FMIN,FMAX));
  b.gain=cl(Math.round(iy(cl(py,PT,H-PB),H)*10)/10,-10,10);
  syncRow(drag);draw();live();
 });
 const end=()=>{if(drag!==null){drag=null;c.style.cursor='default';commit();live()}};
 c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
 c.addEventListener('dblclick',e=>{
  if(!isCustom())return;const[px,py]=pos(e),n=pick(px,py);if(!n)return;
  cur[n.i].gain=0;syncRow(n.i);commit();draw();live();
 });
 c.addEventListener('wheel',e=>{
  if(!isCustom())return;const[px,py]=pos(e),n=pick(px,py,22);if(!n)return;
  e.preventDefault();si=n.i;const b=cur[n.i];
  b.q=cl(Math.round(b.q*(e.deltaY<0?1.1:1/1.1)*100)/100,0.1,5);
  syncRow(n.i);markSel();commit();draw();live();
 },{passive:false});
 new ResizeObserver(draw).observe(c);
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
 window.addEventListener('mcthemechange',draw);
}
// ---- UI ----
function commit(){if(isCustom())custom=cur}
function pad(){const n=P().n_;for(let i=cur.length;i<n;i++)cur.push(neutral(i,n))}
function render(){
 const ro=!isCustom(),n=cur.length;
 si=Math.min(si,n-1);
 $('tb').innerHTML='';
 for(let i=0;i<n;i++){
  const b=cur[i],tr=document.createElement('tr');
  tr.innerHTML='<td>'+(i+1)+'</td><td><input type="number" value="'+b.fc+'"></td><td><input type="number" step="0.1" value="'+b.gain+'"></td><td><input type="number" step="0.05" value="'+b.q+'"></td>';
  tr.querySelectorAll('input').forEach(el=>{el.disabled=ro;el.onchange=collect;el.oninput=collect;el.onfocus=()=>{si=i;markSel();draw()}});
  $('tb').appendChild(tr);
 }
 markSel();draw();
}
function collect(){
 cur=[...$('tb').rows].map(r=>{const c=r.querySelectorAll('input');return{type:'PK',fc:+c[0].value||0,gain:+c[1].value||0,q:+c[2].value||0.7}});
 commit();draw();live();
}
function sel(){
 const v=$('pre').value;
 cur=(v===CUS?custom:FIXED[v]).map(b=>({...b}));
 document.querySelectorAll('#pi button').forEach(b=>b.classList.toggle('on',b.dataset.k===v));
 $('tl').hidden=!isCustom();
 ['im','ex'].forEach(id=>$(id).hidden=!isCustom());
 pad();commit();render();
}
let skip=0,impPre=null;
// Preamp do arquivo (dB) -> ganho da DAC (passos de 0,5 dB, ±12). Negativo arredonda para MAIS atenuação (evita clipping).
const preFromFile=v=>cl(v<0?-Math.ceil(-v*2-1e-9)/2:Math.round(v*2)/2,-12,12);
function parseAPO(t){
 const o=[];skip=0;impPre=null;
 for(const l of t.split(/\r?\n/)){
  const pm=l.match(/^\s*Preamp\s*:\s*([+-]?\d+(?:[.,]\d+)?)\s*dB/i);
  if(pm){impPre=parseFloat(pm[1].replace(',','.'));continue}
  if(/\bOFF\b/.test(l))continue;
  const m=l.match(/\b(PK|PEQ|LSC|LS|HSC|HS|LPQ|LP|HPQ|HP)\b.*?Fc\s+([\d.]+)\s*Hz(?:.*?Gain\s+(-?[\d.]+)\s*dB)?(?:.*?\bQ\s+([\d.]+))?/i);
  if(!m)continue;
  const k=m[1].toUpperCase();
  if(k!=='PK'&&k!=='PEQ'){skip++;continue}
  o.push({type:'PK',fc:+m[2],gain:+(m[3]||0),q:+(m[4]||0.7)});
 }
 return o;
}
// ---- Gain / Preamp (FiiO protocolo nativo Report 0x02) ----
function updatePreUI(){
 const ok=!!(dev&&(isFiioDev()||has02(dev)));
 const prs=$('prs'), prn=$('prn');
 if(prs) prs.disabled=!ok;
 if(prn) prn.disabled=!ok;
 const pa=prs&&prs.closest('.pa');
 if(pa){
  pa.style.opacity=ok?'1':'0.4';
  pa.style.pointerEvents=ok?'auto':'none';
  pa.setAttribute('data-tip', ok
   ? 'Gain da DAC (FiiO JA11 / Preamp).\nAjusta o ganho de saída da DAC em tempo real.\nDuplo clique no controle = 0 dB.'
   : 'Controle de ganho por hardware desativado para esta DAC (KT02H20 genérico).\nO volume é controlado normalmente pelo sistema/Windows.');
 }
 if(!ok){
  if(prs) prs.value=0;
  if(prn) prn.value='0.0';
 }
}
function setPre(v,fromNum,noWrite){
 preamp=cl(Math.round((+v||0)*2)/2,-12,12);
 $('prs').value=preamp;if(!fromNum)$('prn').value=preamp.toFixed(1);
 try{localStorage.setItem('madcatPreamp',String(preamp))}catch(e){}
 if(!noWrite)pushPre();
}
let preT=0;
function pushPre(){
 if(!dev)return;
 clearTimeout(preT);
 preT=setTimeout(async()=>{
  try{
   if(isFiioDev()||has02(dev)){
    // FiiO JA11: Report 0x02, ganho em dB×10
    await dev.sendReport(0x02,fiioGainFrame(preamp));
   }
  }catch(x){log('Erro no ganho: '+x.message,1)}
 },120);
}
async function readPre(){
 updatePreUI();
 if(!dev)return;
 try{
  if(isFiioDev()||has02(dev)){
   // FiiO JA11: solicita leitura via Report 0x02
   await req02(0x17);
  }
 }catch(x){}
}
// Comando somente leitura (cmd 0x52, não grava nem altera absolutamente nada)
window.lerReg=async function(addr=0x66){
 if(!dev)return console.log('%cConecte a DAC primeiro!','color:red;font-weight:bold');
 try{
  const v=(await xfer(addr,0x52,0))>>>0;
  const hex='0x'+v.toString(16).toUpperCase().padStart(8,'0');
  const u16=v&0xFFFF;
  console.log('%c[Leitura DAC (cmd 0x52 - somente leitura)]','color:#00ffaa;font-weight:bold',
   `Reg 0x${addr.toString(16).toUpperCase()}: decimal = ${v} | hex = ${hex} | 16-bit baixo = ${u16}`);
  return v;
 }catch(e){console.error('Falha na leitura:',e)}
};
let ftT=0;
function flashTip(n,txt,ms=2800){
 const tip=$('tip');clearTimeout(ftT);
 tip.textContent=txt;tip.style.left=tip.style.top='0px';tip.classList.add('on');
 const w=tip.offsetWidth,h=tip.offsetHeight,r=n.getBoundingClientRect();
 let T=r.top-h-8;if(T<8)T=r.bottom+8;
 tip.style.left=cl(r.left+r.width/2-w/2,8,innerWidth-w-8)+'px';tip.style.top=cl(T,8,innerHeight-h-8)+'px';
 ftT=setTimeout(()=>tip.classList.remove('on'),ms);
}
const preStepOk=v=>{const n=parseFloat(v);return isNaN(n)||Math.abs(n*2-Math.round(n*2))<1e-9};
function setupPre(){
 $('prs').oninput=e=>setPre(e.target.value,0,0);
 $('prs').onchange=()=>pushPre();
 $('prs').ondblclick=()=>setPre(0);
 const near=v=>cl(Math.round(parseFloat(v)*2)/2,-12,12);
 const msg=v=>'Passos de 0,5 dB: '+String(parseFloat(v)).replace('.',',')+' arredondado para '+near(v).toFixed(1).replace('.',',')+' dB.';
 $('prn').oninput=e=>{
  const el=e.target,v=el.value;
  if(v===''||v==='-'||isNaN(parseFloat(v)))return;
  if(!preStepOk(v)){el.style.outline='2px solid #d62828';flashTip(el,msg(v))}else el.style.outline='';
  setPre(v,1,0);
 };
 $('prn').onchange=e=>{
  const el=e.target,v=el.value;
  if(v===''||isNaN(parseFloat(v))){el.value=preamp.toFixed(1);el.style.outline='';return}
  const bad=!preStepOk(v);
  el.style.outline='';setPre(v);
  if(bad)flashTip(el,msg(v));
 };
 let v=0;try{v=parseFloat(localStorage.getItem('madcatPreamp'))||0}catch(e){}
 setPre(v,0,true);
}
// ---- balões de ajuda ----
function setupTips(){
 const tip=$('tip');let t=0,au=0,el=null,sx=0,sy=0;
 const hide=()=>{clearTimeout(t);clearTimeout(au);tip.classList.remove('on')};
 const show=(n,x,y)=>{
  tip.textContent=n.dataset.tip;tip.style.left=tip.style.top='0px';tip.classList.add('on');
  const w=tip.offsetWidth,h=tip.offsetHeight,vw=innerWidth,vh=innerHeight;let L,T;
  if(n.dataset.tipAt==='pointer'){L=x+14;T=y+20;if(L+w>vw-8)L=x-w-14;if(T+h>vh-8)T=y-h-14}
  else{const r=n.getBoundingClientRect();L=r.left+r.width/2-w/2;T=r.top-h-8;if(T<8)T=r.bottom+8}
  tip.style.left=cl(L,8,vw-w-8)+'px';tip.style.top=cl(T,8,vh-h-8)+'px';
 };
 const arm=()=>{clearTimeout(t);t=setTimeout(()=>el&&show(el,sx,sy),450)};
 const find=e=>e.target.closest?e.target.closest('[data-tip]'):null;
 addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'){if(Math.hypot(e.clientX-sx,e.clientY-sy)>10)clearTimeout(t);return}
  if(e.buttons){hide();return}
  const n=find(e);
  if(n!==el){hide();el=n;sx=e.clientX;sy=e.clientY;if(n)arm();return}
  if(n&&Math.hypot(e.clientX-sx,e.clientY-sy)>4){sx=e.clientX;sy=e.clientY;hide();arm()}
 });
 addEventListener('pointerdown',e=>{
  hide();
  if(e.pointerType==='mouse')return;
  const n=find(e);if(!n)return;
  el=n;sx=e.clientX;sy=e.clientY;
  t=setTimeout(()=>{show(n,sx,sy);au=setTimeout(hide,3500)},550);
 },true);
 addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')clearTimeout(t)});
 addEventListener('pointercancel',()=>clearTimeout(t));
 document.documentElement.addEventListener('pointerleave',()=>{hide();el=null});
 addEventListener('wheel',hide,{passive:true});
 addEventListener('scroll',hide,true);
 addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
 addEventListener('focusin',e=>{
  const n=find(e);
  if(n&&e.target.matches(':focus-visible')){const r=n.getBoundingClientRect();el=n;show(n,r.left,r.bottom)}
 });
 addEventListener('focusout',hide);
}
function init(){
 $('prof').innerHTML=Object.entries(PROF).map(([k,v])=>'<option value="'+k+'">'+v.n+'</option>').join('');
 try{custom=JSON.parse(localStorage.getItem('ktEqCustom')||'[]')}catch(e){custom=[]}
 $('pre').innerHTML=[...Object.keys(FIXED),CUS].map(k=>'<option>'+k+'</option>').join('');
 $('pi').innerHTML=[...Object.keys(FIXED),CUS].map(k=>'<button data-k="'+k+'">'+k+'</button>').join('');
 $('pi').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('pre').value=b.dataset.k;sel();sent=null;live()});
 $('prof').onchange=()=>{sent=null;enOn=false;dev?readDev():sel()};
 $('pre').onchange=()=>{sel();sent=null;live()};
 $('rs').onclick=()=>{if(!isCustom())return;custom=[];if(isFiioDev()||has02(dev))setPre(0);else{preamp=0;updatePreUI()};sel();live()};
 $('ra').onclick=()=>{if(!isCustom())return;if(!anchor||anchor.k!==$('prof').value)return toast('Sem leitura inicial da DAC para este chip.',1);custom=anchor.bands.map(b=>({...b}));if(anchor.pre!=null)setPre(anchor.pre);sel();live();toast('Voltou ao estado lido da DAC.'+(anchor.pre!=null?' Ganho: '+anchor.pre.toFixed(1)+' dB.':''))};
 $('im').onclick=()=>$('imf').click();
 $('imf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const o=parseAPO(await f.text());e.target.value='';if(!o.length)return log('Nada reconhecido no arquivo.',1);custom=o;$('pre').value=CUS;sel();localStorage.setItem('ktEqCustom',JSON.stringify(custom));live();
  let pm='';
  if(impPre!==null){const g=preFromFile(impPre);setPre(g);pm=' Preamp '+impPre+' dB → ganho da DAC '+g.toFixed(1)+' dB'+(Math.abs(g-impPre)>1e-9?' (passo de 0,5 dB)':'')+'.'}
  toast(o.length+' filtros importados.'+pm+(skip?' '+skip+' shelf/LP/HP ignorado(s).':''),!!skip)};
 $('ex').onclick=()=>{const t=(preamp?'Preamp: '+preamp.toFixed(1)+' dB\n':'')+cur.filter(active).map((b,i)=>'Filter '+(i+1)+': ON PK Fc '+b.fc+' Hz Gain '+b.gain+' dB Q '+b.q).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=($('pre').value||'preset')+'.txt';a.click()};
 $('con').onclick=()=>connect().catch(e=>{if(e.name!=='NotFoundError')log('Erro: '+e.message,1)});
 $('sv').onclick=apply;
 setupCanvas();setupTips();setupPre();
 $('pre').value=CUS;
 sel();
 updatePreUI();
 if(!navigator.hid){log('WebHID indisponível: use Chrome ou Edge (desktop ou Android).',1);return}
 navigator.hid.addEventListener('disconnect',e=>{if(e.device===dev){dev=null;setConn(false);updatePreUI()}});
 addEventListener('pagehide',()=>{try{dev&&dev.close()}catch(e){}});
}
init();
</script>
<script>
/* ===== Add-on: reconhecimento FiiO/KT + diagnóstico de registradores ===== */
(()=>{
const VIDS=[0x31B2,0x2972];
const hx=(n,w=4)=>'0x'+(n>>>0).toString(16).toUpperCase().padStart(w,'0');
const h2=n=>(n&255).toString(16).toUpperCase().padStart(2,'0');
const s8=n=>{n&=255;return n>127?n-256:n};
const db512=u=>u>0?(20*Math.log10(u/512)).toFixed(2)+' dB':'-inf dB (mudo)';

PID[0x0102]='h20';
try{const m=JSON.parse(localStorage.getItem('madcatPidMap')||'{}');for(const k in m)if(PROF[m[k]])PID[+k]=m[k]}catch(e){}

document.body.insertAdjacentHTML('beforeend',
'<details id="dg" style="display:none!important"><summary class="m" style="cursor:pointer">Diagnóstico (DAC e registradores)</summary>'+
'<pre id="dgi" class="m" style="white-space:pre-wrap;font:12px monospace">Conecte a DAC para ver as informações.</pre>'+
'<div class="r"><button id="dgm">Memorizar este PID no perfil selecionado</button></div>'+
'<div class="r"><span class="m">Monitorar reg (hex)</span><input id="dgw" value="66" size="5"><button id="dgt">Iniciar</button><span id="dgv" class="m" style="font:12px monospace"></span></div>'+
'<div class="r"><span class="m">Log de tudo que o app ESCREVE na DAC</span><button id="dgx">Limpar</button></div>'+
'<pre id="dgg" class="m" style="white-space:pre-wrap;font:12px monospace;max-height:160px;overflow:auto">(vazio)</pre>'+
'<div class="m">Leitura somente (cmd 0x52), nada é gravado. Faixa de endereços em hexadecimal:</div>'+
'<div class="r"><input id="dga" value="0" size="5"><input id="dgb" value="FF" size="5"><input id="dgl" placeholder="rótulo (ex.: pregain 0 dB)" style="flex:1 1 160px"><button id="dgs">Capturar</button></div>'+
'<div class="r"><select id="dg1"></select><select id="dg2"></select><button id="dgc">Comparar</button></div>'+
'<pre id="dgo" style="white-space:pre-wrap;font:12px monospace;user-select:all"></pre></details>');

const colInfo=d=>d.collections.map((c,i)=>{
 const f=a=>'['+a.map(r=>hx(r.reportId,2)).join(',')+']';
 return '#'+i+' usagePage '+hx(c.usagePage)+' usage '+hx(c.usage)+'  in:'+f(c.inputReports)+' out:'+f(c.outputReports)+' feat:'+f(c.featureReports);
}).join('\n');
function showInfo(d){
 const k=PID[d.productId];
 $('dgi').textContent='Produto: '+(d.productName||'?')+'\nVID '+hx(d.vendorId)+'  PID '+hx(d.productId)+
  '\nPerfil: '+(k?PROF[k].n:'não reconhecido')+'\nReport 0x4B: '+(has4B(d)?'sim':'NÃO')+'\nReport 0x02 (FiiO): '+(has02(d)?'sim':'NÃO')+'\n'+colInfo(d);
}

const wl=[];
const t3=()=>{const d=new Date();return d.toTimeString().slice(0,8)+'.'+String(d.getMilliseconds()).padStart(3,'0')};
function hook(d){
 if(d._hk)return;d._hk=1;const o=d.sendReport.bind(d);
 d.sendReport=(id,b)=>{
  if(id===0x02){
   wl.push(t3()+'  [FiiO 0x02] cmd '+hx(b[4],2)+'  seq '+hx(b[3],2)+'  len '+hx(b[5],2));
   if(wl.length>60)wl.shift();$('dgg').textContent=wl.join('\n');$('dgg').scrollTop=1e9;
   return o(id,b);
  }
  const a=(b[0]|b[1]<<8|b[2]<<16|b[3]<<24)>>>0,c=b[4],v=(b[6]|b[7]<<8|b[8]<<16|b[9]<<24)>>>0;
  if(BLOCK.includes(a)&&c===0x57){
   wl.push(t3()+'  BLOQUEADA reg '+hx(a,2)+' = '+hx(v,8));
   if(wl.length>60)wl.shift();$('dgg').textContent=wl.join('\n');$('dgg').scrollTop=1e9;
   return Promise.resolve();
  }
  if(c!==0x52){
   wl.push(t3()+'  '+(c===0x57?'ESCRITA':c===0x53?'SALVA NA FLASH':'cmd '+hx(c,2))+'  reg '+hx(a,2)+'  = '+hx(v,8));
   if(wl.length>60)wl.shift();$('dgg').textContent=wl.join('\n');$('dgg').scrollTop=1e9;
  }
  return o(id,b);
 };
}
$('dgx').onclick=()=>{wl.length=0;$('dgg').textContent='(vazio)'};
async function connect2(){
 const ds=await navigator.hid.requestDevice({filters:VIDS.map(v=>({vendorId:v}))});
 const d=ds.find(has4B)||ds[0];if(!d)return;
 showInfo(d);
 if(!has4B(d)){log('Interface sem report 0x4B. Escolha outra entrada da lista.',1);return}
 hook(d);await openDev(d);showInfo(d);
}
$('con').onclick=()=>connect2().catch(e=>{if(e.name!=='NotFoundError')log('Erro: '+e.message,1)});

$('dgm').onclick=()=>{
 if(!dev)return toast('Conecte a DAC primeiro.',1);
 let m={};try{m=JSON.parse(localStorage.getItem('madcatPidMap')||'{}')}catch(e){}
 m[dev.productId]=$('prof').value;
 try{localStorage.setItem('madcatPidMap',JSON.stringify(m))}catch(e){}
 PID[dev.productId]=$('prof').value;showInfo(dev);toast('PID '+hx(dev.productId)+' associado a '+PROF[$('prof').value].n);
};

const snaps=[];
const fill=()=>{const o=snaps.map((s,i)=>'<option value="'+i+'">'+(i+1)+': '+s.l+'</option>').join('');$('dg1').innerHTML=o;$('dg2').innerHTML=o;if(snaps.length>1){$('dg1').value=snaps.length-2;$('dg2').value=snaps.length-1}};
$('dgs').onclick=async()=>{
 if(!dev)return toast('Conecte a DAC primeiro.',1);
 const a=parseInt($('dga').value,16),b=parseInt($('dgb').value,16);
 if(isNaN(a)||isNaN(b)||b<a||b-a>1023)return toast('Faixa inválida (máx. 1024 endereços).',1);
 const bt=$('dgs'),d={};bt.disabled=true;
 for(let r=a;r<=b;r++){
  bt.textContent=hx(r,2)+' / '+hx(b,2);
  try{d[r]=(await xfer(r,0x52,0,300))>>>0}catch(e){d[r]=null}
  await new Promise(z=>setTimeout(z,10));
 }
 bt.disabled=false;bt.textContent='Capturar';
 snaps.push({l:$('dgl').value||('captura '+(snaps.length+1)),d});fill();
 toast('Capturado: '+Object.values(d).filter(v=>v!=null).length+' registradores lidos.');
};
$('dgc').onclick=()=>{
 const A=snaps[$('dg1').value],B=snaps[$('dg2').value];
 if(!A||!B)return toast('Capture pelo menos duas vezes.',1);
 const L=['A = '+A.l,'B = '+B.l,''];
 for(const k of Object.keys(A.d)){
  const a=A.d[k],b=B.d[k];if(a===b||b===undefined)continue;
  if(a==null||b==null){L.push(hx(+k,4)+'  leitura falhou em um dos lados');continue}
  const ch=[];
  for(let i=0;i<4;i++){const x=(a>>>(8*i))&255,y=(b>>>(8*i))&255;if(x!==y)ch.push('byte'+i+' '+h2(x)+'→'+h2(y)+' (int8 '+s8(x)+'→'+s8(y)+', /2 = '+s8(x)/2+'→'+s8(y)/2+')')}
  ch.push('u16 baixo '+(a&65535)+'→'+(b&65535)+'  ('+db512(a&65535)+' → '+db512(b&65535)+' se 512 = 0 dB)');
  L.push(hx(+k,4)+'  '+hx(a,8)+' → '+hx(b,8)+'\n        '+ch.join('\n        '));
 }
 if(L.length===3)L.push('Nenhum registrador mudou nessa faixa.');
 $('dgo').textContent=L.join('\n');
};
let mon=0;
$('dgt').onclick=()=>{
 if(mon){clearInterval(mon);mon=0;$('dgt').textContent='Iniciar';return}
 if(!dev)return toast('Conecte a DAC primeiro.',1);
 const a=parseInt($('dgw').value,16);if(isNaN(a))return toast('Endereço inválido.',1);
 $('dgt').textContent='Parar';let bz=0;
 mon=setInterval(async()=>{
  if(bz||!dev)return;bz=1;
  try{const v=(await xfer(a,0x52,0,400))>>>0;
   $('dgv').textContent=hx(a,2)+' = '+hx(v,8)+'  u16 '+(v&65535)+' ('+db512(v&65535)+' se 512 = 0 dB)  | b0 '+s8(v)+' b1 '+s8(v>>>8)}
  catch(e){$('dgv').textContent='falha na leitura'}
  bz=0;
 },500);
};
})();
</script>

(function(){
